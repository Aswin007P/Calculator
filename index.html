<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* 🔒 NO SCROLLING */
    }

    .calculator-body {
      width: 320px;
      background: #222;
      border-radius: 20px;
      padding: 24px 16px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.8),
        inset 0 -3px 10px rgba(0, 0, 0, 0.6),
        inset 0 3px 5px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* LCD-like display */
    .display {
      width: 100%;
      height: 60px;
      background: #000;
      color: #0f0;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow:
        inset 0 2px 4px rgba(0, 255, 0, 0.1),
        inset 0 -2px 6px rgba(0, 30, 0, 0.8);
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 1px;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      width: 100%;
      height: 56px;
      background: #333;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      position: relative;
      box-shadow:
        0 4px 0 #111,
        0 6px 6px rgba(0, 0, 0, 0.5);
      transition: all 0.1s ease;
    }

    /* Real button press */
    .btn:active {
      transform: translateY(4px);
      box-shadow:
        0 0 0 #111,
        0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .btn-number { background: #333; }
    .btn-operator { background: #ff9500; color: #000; }
    .btn-clear { background: #a53737; }
    .btn-equals { background: #4CAF50; }
    .btn-back { background: #555; }

    /* Plastic body shine */
    .calculator-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
      border-radius: 20px 20px 0 0;
    }
  </style>
</head>
<body>
  <div class="calculator-body">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn btn-back" onclick="backspace()">⌫</button>
      <button class="btn btn-operator" onclick="appendValue('%')">%</button>
      <button class="btn btn-operator" onclick="appendValue('/')">/</button>

      <!-- Row 2 -->
      <button class="btn btn-number" onclick="appendValue('7')">7</button>
      <button class="btn btn-number" onclick="appendValue('8')">8</button>
      <button class="btn btn-number" onclick="appendValue('9')">9</button>
      <button class="btn btn-operator" onclick="appendValue('*')">×</button>

      <!-- Row 3 -->
      <button class="btn btn-number" onclick="appendValue('4')">4</button>
      <button class="btn btn-number" onclick="appendValue('5')">5</button>
      <button class="btn btn-number" onclick="appendValue('6')">6</button>
      <button class="btn btn-operator" onclick="appendValue('-')">−</button>

      <!-- Row 4 -->
      <button class="btn btn-number" onclick="appendValue('1')">1</button>
      <button class="btn btn-number" onclick="appendValue('2')">2</button>
      <button class="btn btn-number" onclick="appendValue('3')">3</button>
      <button class="btn btn-operator" onclick="appendValue('+')">+</button>

      <!-- Row 5 -->
      <button class="btn btn-number" onclick="appendValue('.')">.</button>
      <button class="btn btn-number" onclick="appendValue('0')">0</button>
      <button class="btn btn-equals" onclick="calculateResult()" style="grid-column: span 2;">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.innerText === '0' && value !== '.') {
        display.innerText = value;
      } else {
        const lastChar = display.innerText.slice(-1);
        const operators = ['+', '−', '*', '/', '%'];
        if (operators.includes(value) && operators.includes(lastChar)) {
          display.innerText = display.innerText.slice(0, -1) + value;
          return;
        }
        if (display.innerText === 'Error') {
          display.innerText = value;
          return;
        }
        display.innerText += value;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
    }

    function backspace() {
      if (display.innerText === 'Error' || display.innerText === '0') {
        display.innerText = '0';
        return;
      }
      let val = display.innerText.slice(0, -1);
      display.innerText = val === '' ? '0' : val;
    }

    function calculateResult() {
      let expr = display.innerText
        .replace(/×/g, '*')
        .replace(/−/g, '-')
        .replace(/÷/g, '/');

      if (expr === '0') return;

      const safePattern = /^[0-9+\-*/.%() ]+$/;
      if (!safePattern.test(expr)) {
        display.innerText = 'Error';
        setTimeout(() => { if (display.innerText === 'Error') display.innerText = '0'; }, 1000);
        return;
      }

      try {
        // Safer evaluation
        const result = Function('"use strict"; return (' + expr + ')')();
        const formatted = parseFloat(result.toFixed(10));
        display.innerText = isNaN(formatted) ? 'Error' : formatted;
        setTimeout(() => {
          if (display.innerText !== 'Error') {
            // Auto-trim long numbers
            if (display.innerText.length > 12) {
              display.innerText = parseFloat(display.innerText).toExponential(6);
            }
          }
        }, 10);
      } catch (e) {
        display.innerText = 'Error';
        setTimeout(() => { if (display.innerText === 'Error') display.innerText = '0'; }, 1000);
      }
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendValue(e.key);
      else if (e.key === '.') appendValue('.');
      else if (['+', '-', '*', '/', '%'].includes(e.key)) {
        appendValue(e.key === '*' ? '×' : e.key === '-' ? '−' : e.key);
      }
      else if (e.key === 'Enter' || e.key === '=') calculateResult();
      else if (e.key === 'Escape') clearDisplay();
      else if (e.key === 'Backspace') backspace();
    });
  </script>
</body>
</html>
